name: 重建並發布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 檢查資料
        run: python3 tools/check.py
      - name: 重建頁面
        run: python3 tools/make.py
      - name: 把重建結果存回 repo
        run: |
          if [ -n "$(git status --porcelain -- index.html data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html data/
            git commit -m "Rebuild chart from data/certs.csv [skip ci]"
            git push
          fi
      - name: 準備發布內容
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
