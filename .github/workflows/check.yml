name: 檢查資料並預覽

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 檢查 certs.csv 與 ladders.txt
        run: python3 tools/check.py
      - name: 重建頁面
        run: python3 tools/make.py
      - name: 列出這次更動造成的差異
        run: |
          {
            echo "### 重建後與送出內容的差異"
            echo '```'
            git diff --stat -- index.html data/ || true
            echo '```'
            echo "### 分數或位置變動的證照"
            echo '```'
            git diff -U0 -- data/ranked.csv | grep '^[-+][^-+]' | cut -d, -f1,11,14 | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上傳預覽頁面
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: index.html
